name: Publish itch.io

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: itch-io
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      vars.ITCH_IO_TARGET != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAGES_BASE_PATH: /uploads/citadel/
      CITADEL_BUILD_MODE: itch
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version: 1.5.1
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp check
      - name: Fast game and build regression tests
        run: vp test run
      - run: vp build --mode itch
        env:
          NODE_ENV: production
      - run: vp exec playwright install --with-deps chromium
      - name: Browser smoke, release Settings and nested asset paths
        run: >-
          vp exec playwright test tests/scaffold.spec.ts tests/app-artwork.spec.ts tests/ios-touch.spec.ts
          --grep "production game fills the viewport|Settings diagnostic actions match the build profile|browser and Home Screen icons|Facebook preview|touch serving blocks iOS"
          --workers=1
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: itch-html5
          path: dist-itch/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: itch-html5
          path: dist-itch/
      - name: Install Butler
        shell: bash
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default \
            --output "$RUNNER_TEMP/butler.zip"
          unzip -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"
          echo "$RUNNER_TEMP/butler" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/butler/butler" version
      - name: Upload HTML5 build
        shell: bash
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_IO_TARGET: ${{ vars.ITCH_IO_TARGET }}
          ITCH_IO_CHANNEL: ${{ vars.ITCH_IO_CHANNEL || 'html5' }}
          ITCH_IO_VERSION: ${{ github.sha }}
        run: bash tooling/publish-itch.sh
