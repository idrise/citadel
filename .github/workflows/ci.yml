name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAGES_BASE_PATH: /citadel/
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version: 1.5.1
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp check
      - name: Fast game and build regression tests
        run: vp test run
      - run: vp build --mode production
        env:
          NODE_ENV: production
      - name: Build Reddit SDK package
        run: vp run build:reddit
      - run: vp exec playwright install --with-deps chromium
      - name: Browser smoke and release Settings
        run: >-
          vp exec playwright test tests/scaffold.spec.ts tests/ios-touch.spec.ts
          --grep "production game fills the viewport|Settings diagnostic actions match the build profile|touch serving blocks iOS"
          --workers=1
        env:
          CITADEL_BUILD_MODE: production

  upload-reddit:
    needs: validate
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: reddit-upload
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version: 1.5.1
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Authenticate and upload private Reddit version
        env:
          DEVVIT_AUTH_TOKEN: ${{ secrets.DEVVIT_AUTH_TOKEN }}
          NODE_ENV: production
        run: bash tooling/publish-reddit.sh
