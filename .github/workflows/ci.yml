name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAGES_BASE_PATH: /citadel/
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version: 1.5.1
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp check
      - run: vp test run
      - run: vp build --mode production
        env:
          NODE_ENV: production
      - run: vp exec playwright install --with-deps chromium
      - name: Browser smoke and release Settings
        run: >-
          vp exec playwright test tests/scaffold.spec.ts tests/ios-touch.spec.ts
          --grep "production game fills the viewport|Settings diagnostic actions match the build profile|touch serving blocks iOS"
          --workers=1
        env:
          CITADEL_BUILD_MODE: production
