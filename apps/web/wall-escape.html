<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Citadel — wall rally review</title>
    <link rel="icon" href="data:," />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 20px;
        background: #070b14;
        color: #dceaf4;
        font:
          15px system-ui,
          sans-serif;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px;
      }
      p {
        max-width: 850px;
        line-height: 1.5;
      }
      main {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
      }
      h2 {
        font-size: 17px;
      }
      .stage {
        position: relative;
        height: 480px;
      }
      .stage canvas {
        position: absolute;
        inset: 0;
      }
      .stage .scene-controls,
      .stage .scene-settings-controls {
        display: none;
      }
      output {
        display: block;
        font-variant-numeric: tabular-nums;
        min-height: 42px;
      }
      input {
        width: min(600px, 75%);
        accent-color: #71d9f1;
      }
      button {
        background: #152334;
        color: #dceaf4;
        border: 1px solid #71d9f1;
        padding: 8px 16px;
        border-radius: 5px;
        font: inherit;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 3px solid white;
        outline-offset: 4px;
      }
      a {
        color: #71d9f1;
      }
      @media (max-width: 700px) {
        body {
          padding: 14px;
        }
        main {
          grid-template-columns: 1fr;
        }
        .stage {
          height: 300px;
        }
      }
    </style>
  </head>
  <body>
    <h1>Rounded arena: wall rally review</h1>
    <p>
      Identical straight shots and frozen defenders. The left uses the previous wall response; the
      right adds escape spin after four wall bounces. Each shot stops on its first defence contact.
    </p>
    <button id="play">Pause</button>
    <input
      id="time"
      type="range"
      min="0"
      max="20"
      step="0.01"
      value="0"
      aria-label="Playing seconds"
    />
    <span id="elapsed">0.0s</span>
    <main>
      <section>
        <h2>Before</h2>
        <div id="before" class="stage"></div>
        <output id="before-status"></output>
      </section>
      <section>
        <h2>With escape spin</h2>
        <div id="after" class="stage"></div>
        <output id="after-status"></output>
      </section>
    </main>
    <p>Review fixture only. <a href="./">Play the game</a></p>
    <script type="module" src="/src/dev/wall-escape-review.ts"></script>
  </body>
</html>
